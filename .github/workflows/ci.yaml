name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      # POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      TESTPOSTGRES_DB: ${{ secrets.TESTPOSTGRES_DB }}
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # AWS_REGION: ${{ secrets.AWS_REGION }}
      # AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
      EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      # REDIS_PORT: ${{ secrets.REDIS_PORT }}
      # REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      # REDIS_HOST: ${{ secrets.REDIS_HOST }}
      OTP_EXPIRE_SECONDS: ${{ secrets.OTP_EXPIRE_SECONDS }}
      OTP_LOCK_SECONDS: ${{ secrets.OTP_LOCK_SECONDS }}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRES_MINUTES }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      SECURITY_KEY: ${{ secrets.SECURITY_KEY }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pip install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run unit tests
        run: poetry run pytest src/tests/unit --cov=src --cov-report=term-missing

      - name: Run integration tests
        run: poetry run pytest src/tests/integration --cov=src --cov-append --cov-report=term-missing

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build base image
        run: docker build -f Docker/Dockerfile.base -t my-base-image:latest .

      - name: Build and push API image
        run: |
          docker build -f Docker/Dockerfile.api -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-api:${{ github.sha }} .
          docker build -f Docker/Dockerfile.api -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-api:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-api:latest

      - name: Build and push Worker image
        run: |
          docker build -f Docker/Dockerfile.worker -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-worker:${{ github.sha }} .
          docker build -f Docker/Dockerfile.worker -t ${{ secrets.DOCKERHUB_USERNAME }}/myapp-worker:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-worker:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/myapp-worker:latest
        