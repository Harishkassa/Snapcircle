[project]
name = "default-prediction-main"
version = "0.1.0"
description = "python fixed dependencies"
authors = [
    {name = "Harishkassa",email = "harishkassa24@gmail.com"}
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "pycryptodome (>=3.23.0,<4.0.0)",
    "boto3 (>=1.43.83,<2.0.0)",
    "botocore (>=1.43.83,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "dependency-injector (>=4.49.1,<5.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "hydra-core (>=1.3.6,<2.0.0)",
    "insightface (>=1.0.1,<2.0.0)",
    "numpy (>=2.5.2,<3.0.0)",
    "omegaconf (>=2.3.1,<3.0.0)",
    "opencv-python-headless (>=5.0.0.93,<6.0.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "retina-face (>=0.0.18,<0.0.19)",
    "slowapi (>=0.1.10,<0.2.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "twilio (>=9.11.0,<10.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "websockets (>=17.1,<18.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "tf-keras (>=2.21.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "asgiref (>=3.12.1,<4.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "bcrypt (>=4.0.1,<4.1)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "fakeredis (>=2.37.1,<3.0.0)"
]
