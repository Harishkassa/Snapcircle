services:
  app:
    image: harrykassa/myapp-api:latest
    container_name: fastapi_app
    restart: always
    env_file:
      - .env
    volumes:
      - ./buffalo_l:/root/.insightface/models/buffalo_l
      - ./deepface_weights:/root/.deepface/weights
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 2g
    mem_limit: 4g
    mem_reservation: 2g
    networks:
      - backend

  worker:
    image: harrykassa/myapp-worker:latest
    container_name: fastapi_worker
    restart: always
    env_file:
      - .env
    volumes:
      - ./buffalo_l:/root/.insightface/models/buffalo_l
      - ./deepface_weights:/root/.deepface/weights
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:17-alpine
    container_name: fastapi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8.10.1-alpine
    container_name: fastapi_redis
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/var/lib/redis/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD}

volumes:
  postgres_data:
  redis_data:

networks:
  backend: